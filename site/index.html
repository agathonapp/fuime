<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fuime</title>
    <meta name="description" content="A business account that takes instructions. 2027." />
    <link rel="canonical" href="https://fuime.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fuime" />
    <meta property="og:url" content="https://fuime.com/" />
    <meta property="og:title" content="Fuime" />
    <meta property="og:description" content="A business account that takes instructions. 2027." />
    <!-- A 10 s silent loop (tools/og-film renders it). Discord, iMessage and
         Telegram play og:video inline; X, Slack and LinkedIn fall back to the
         og:image poster, which is the film's end card. -->
    <meta property="og:video" content="https://fuime.com/vid/fuime-instructions.mp4" />
    <meta property="og:video:secure_url" content="https://fuime.com/vid/fuime-instructions.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta property="og:image" content="https://fuime.com/img/v2/og-instructions.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Fuime arch mark above the line: a business account that takes instructions." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fuime" />
    <meta name="twitter:description" content="A business account that takes instructions. 2027." />
    <meta name="twitter:image" content="https://fuime.com/img/v2/og-instructions.jpg" />
    <meta name="theme-color" content="#f7f3e8" />
    <link rel="icon" href="/img/v2/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <!-- Stealth front door, 2026-11-06. The mark, and under it one small line
         typing instructions to the account and the account answering. It hints
         at the product (an account with an agent in it) without pitching it.
         The full page is parked, unserved, at legacy/index-agent-2026-11.html.
         Everything is inline so the page is one request. -->
    <style>
      :root {
        --ground: #f7f3e8;
        --ink: #171a18;
        --muted: #8a857a;
        --green: #2e7d5b;
        --line: #ddd5c2;
        --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      main {
        display: grid;
        place-items: center;
        height: 100vh;
        height: 100dvh;
        padding: 0 24px;
      }
      .stack {
        display: grid;
        justify-items: center;
        gap: 40px;
        translate: 0 -4vh;
      }
      h1 {
        margin: 0;
      }
      .mark {
        display: block;
        width: clamp(56px, 6vw, 76px);
        height: auto;
        animation: in 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      /* the instruction line */
      .term {
        width: min(440px, 88vw);
        height: 3em;
        text-align: center;
        animation: in 1.4s 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .term p {
        margin: 0;
        min-height: 1.5em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .cmd::after {
        content: '';
        display: inline-block;
        width: 7px;
        height: 1.05em;
        margin-left: 2px;
        vertical-align: -0.15em;
        background: var(--ink);
        animation: blink 1s steps(1) infinite;
      }
      .term.is-answering .cmd::after {
        visibility: hidden;
      }
      .ans {
        color: var(--green);
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .ans.is-on {
        opacity: 1;
      }

      /* the bottom line */
      .foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(26px, env(safe-area-inset-bottom));
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 0 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        animation: in 1.4s 1s ease both;
      }
      .foot p {
        margin: 0;
      }
      .invite {
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink);
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--line);
        cursor: pointer;
      }
      .invite:hover {
        text-decoration-color: var(--ink);
      }
      .capture {
        display: none;
      }
      .foot.is-open .invite {
        display: none;
      }
      .foot.is-open .capture {
        display: block;
      }
      .capture__row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: min(340px, 86vw);
        padding: 4px 4px 4px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fbf9f2;
      }
      .capture__row:focus-within {
        border-color: var(--green);
      }
      .capture input {
        flex: 1;
        min-width: 0;
        height: 32px;
        border: 0;
        background: transparent;
        font: 14px var(--sans);
        color: var(--ink);
        outline: none;
      }
      .capture input::placeholder {
        color: var(--muted);
      }
      .capture button {
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font: 500 13px var(--sans);
        cursor: pointer;
      }
      .capture__msg {
        margin: 8px 0 0;
        min-height: 1.5em;
      }
      .capture__msg:empty {
        display: none;
      }
      .capture__msg[data-state='error'] {
        color: #9a3b1e;
      }
      .capture__done {
        display: none;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--green);
      }
      .capture__plane {
        width: 16px;
        height: 16px;
      }
      .capture[data-done='true'] .capture__row,
      .capture[data-done='true'] .capture__msg {
        display: none;
      }
      .capture[data-done='true'] .capture__done {
        display: flex;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark,
        .term,
        .foot {
          animation: none;
        }
        .cmd::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- id="join" and [data-account-none] are a contract with the Rails app
         (Fuime::Signups sends a sign-in with no account to /?account=none#join). -->
    <main id="join">
      <div class="stack">
        <h1><img class="mark" src="/img/v2/logo.svg" width="49" height="41" alt="Fuime" /></h1>
        <p class="sr">A business account that takes instructions. Coming in 2027.</p>
        <div class="term" aria-hidden="true">
          <p class="cmd" data-cmd>move 25% of every payment to taxes</p>
          <p class="ans is-on" data-ans>done. $787.50 moved today.</p>
        </div>
      </div>
    </main>

    <div class="foot" data-foot>
      <p data-account-none hidden>There's no Fuime account for that email. Sign-ups are closed for now.</p>
      <p>a business account that takes instructions &middot; 2027</p>
      <button class="invite" type="button" data-invite>request an invite</button>
      <form class="capture" data-source="stealth-waitlist" novalidate>
        <div class="capture__row">
          <label class="sr" for="invite-email">Email address</label>
          <input id="invite-email" type="email" name="email" autocomplete="email" placeholder="email" required />
          <button type="submit">Send</button>
        </div>
        <p class="capture__msg" role="status" aria-live="polite"></p>
        <p class="capture__done">
          <svg class="capture__plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2.5 2.8 10.3a.4.4 0 0 0 .05.75l7.7 2.3 2.3 7.7a.4.4 0 0 0 .75.05Z"/><path d="M21.5 2.5 10.55 13.45"/></svg>
          noted. we'll write when it's ready.
        </p>
      </form>
    </div>

    <script>
      ;(function () {
        var foot = document.querySelector('[data-foot]')

        // The app's redirect for a sign-in with no account.
        if (/(?:^|[?&])account=none(?:&|$)/.test(location.search)) {
          document.querySelector('[data-account-none]').hidden = false
        }

        /* ── the instruction line ───────────────────────────────────────
           Types an instruction, the account answers, it clears, the next
           one types. Loops. With reduced motion the first pair just sits. */
        // Account actions (wires, ACH, cards, balances) alternate with agent
        // ones (rules, reports, follow-ups), so it reads as a business account
        // with an agent in it, not a chatbot.
        var LINES = [
          ['move 25% of every payment to taxes', 'done. $787.50 moved today.'],
          ['wire $2,284.50 to bayside tile', 'sent. arrives before 5 pm.'],
          ['what did the chen kitchen job make?', '$2,130 after materials.'],
          ['new card for kim, $500 a month', 'card ·· 9912 is ready.'],
          ['pay the crew friday by ach', 'scheduled. $3,860.00 to 3 people.'],
          ["what's in operating?", '$18,958.06.'],
          ['remind delgado if 1042 is late', "i'll show you the note first."],
        ]
        var term = document.querySelector('.term')
        var cmd = document.querySelector('[data-cmd]')
        var ans = document.querySelector('[data-ans]')
        var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches

        if (!still) {
          var wait = function (ms) {
            return new Promise(function (r) {
              setTimeout(r, ms)
            })
          }
          var type = async function (text) {
            for (var i = 1; i <= text.length; i++) {
              cmd.textContent = text.slice(0, i)
              var ch = text[i - 1]
              await wait(ch === ' ' ? 70 : 38 + Math.random() * 46)
            }
          }
          var erase = async function () {
            ans.classList.remove('is-on')
            await wait(250)
            var t = cmd.textContent
            for (var i = t.length; i >= 0; i--) {
              cmd.textContent = t.slice(0, i)
              await wait(14)
            }
          }
          var run = async function () {
            cmd.textContent = ''
            ans.textContent = ''
            ans.classList.remove('is-on')
            await wait(1600)
            for (var n = 0; ; n = (n + 1) % LINES.length) {
              term.classList.remove('is-answering')
              await type(LINES[n][0])
              await wait(650)
              term.classList.add('is-answering')
              ans.textContent = LINES[n][1]
              ans.classList.add('is-on')
              await wait(2600)
              term.classList.remove('is-answering')
              await erase()
              await wait(450)
            }
          }
          run()
        }

        /* ── invite ─────────────────────────────────────────────────── */
        var invite = document.querySelector('[data-invite]')
        var form = document.querySelector('form.capture')
        var input = form.querySelector('input')
        var btn = form.querySelector('button[type="submit"]')
        var msg = form.querySelector('.capture__msg')
        var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/
        var busy = false

        invite.addEventListener('click', function () {
          foot.classList.add('is-open')
          input.focus()
        })

        form.addEventListener('submit', function (ev) {
          ev.preventDefault()
          if (busy) return
          var email = (input.value || '').trim()
          if (!EMAIL_RE.test(email) || email.length > 254) {
            msg.textContent = "that address doesn't look right."
            msg.setAttribute('data-state', 'error')
            input.focus()
            return
          }
          busy = true
          btn.disabled = true
          msg.textContent = ''
          fetch('/api/waitlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, source: form.getAttribute('data-source') }),
          })
            .then(function (res) {
              if (!res.ok) throw new Error('http ' + res.status)
              form.setAttribute('data-done', 'true')
            })
            .catch(function () {
              msg.textContent = "that didn't send. email support@fuime.com."
              msg.setAttribute('data-state', 'error')
            })
            .finally(function () {
              busy = false
              btn.disabled = false
            })
        })
      })()
    </script>
  </body>
</html>
