<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fuime: business accounts for teens</title>
    <meta name="description" content="Fuime is a business account for teens, opened as a joint account with a parent or guardian. Coming 2027. Request an invite." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://fuime.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fuime" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://fuime.com/" />
    <meta property="og:title" content="Fuime: business accounts for teens" />
    <meta property="og:description" content="Fuime is a business account for teens, opened as a joint account with a parent or guardian. Coming 2027. Request an invite." />
    <meta property="og:image" content="https://fuime.com/img/v2/og-teens.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Fuime arch mark above the line: business accounts for teens." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fuime: business accounts for teens" />
    <meta name="twitter:description" content="Fuime is a business account for teens, opened as a joint account with a parent or guardian. Coming 2027. Request an invite." />
    <meta name="twitter:image" content="https://fuime.com/img/v2/og-teens.jpg" />
    <meta name="twitter:image:alt" content="The Fuime arch mark above the line: business accounts for teens." />
    <meta name="theme-color" content="#f7f3e8" />
    <link rel="icon" href="/img/v2/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <!-- Structured data for search and answer engines. Every value here is
         said on this page or in its head, except founder and
         parentOrganization, which the owner confirmed on 2026-11-13. No
         prices, ratings or partners, because the page states none. sameAs is
         left out until Fuime has public profiles to point at. Keep the
         description in step with the one-sentence definition in .sr below. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://fuime.com/#org",
            "name": "Fuime",
            "url": "https://fuime.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://fuime.com/img/apple-touch-icon.png",
              "width": 180,
              "height": 180
            },
            "email": "support@fuime.com",
            "founder": {
              "@type": "Person",
              "@id": "https://www.rushilchopra.com/#person",
              "name": "Rushil Chopra",
              "url": "https://www.rushilchopra.com"
            },
            "parentOrganization": {
              "@type": "Organization",
              "name": "Ninth Street Labs",
              "url": "https://ninthstreetlabs.com"
            },
            "description": "Fuime is a business account for teens, opened jointly with a parent or guardian. Coming in 2027."
          },
          {
            "@type": "WebSite",
            "@id": "https://fuime.com/#website",
            "name": "Fuime",
            "url": "https://fuime.com/",
            "description": "Fuime is a business account for teens, opened as a joint account with a parent or guardian. Coming 2027. Request an invite.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://fuime.com/#org" }
          }
        ]
      }
    </script>
    <!-- Stealth front door. The mark, one line saying who it is for
         (2026-11-23: approved for teens), and an invite request. The typed
         agent instructions were removed the same day: the page does not lead
         with the agent. An earlier full page is parked, unserved, at
         legacy/index-agent-2026-11.html. Everything is inline: one request. -->
    <style>
      :root {
        --ground: #f7f3e8;
        --ink: #171a18;
        --muted: #8a857a;
        --green: #2e7d5b;
        --line: #ddd5c2;
        --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      main {
        display: grid;
        place-items: center;
        height: 100vh;
        height: 100dvh;
        padding: 0 24px;
      }
      .stack {
        display: grid;
        justify-items: center;
        gap: 40px;
        translate: 0 -4vh;
      }
      h1 {
        margin: 0;
      }
      .mark {
        display: block;
        width: clamp(56px, 6vw, 76px);
        height: auto;
        animation: in 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      /* the one plain statement of what this is */
      .for {
        margin: -22px 0 0;
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
        animation: in 1.4s 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      /* the bottom line */
      .foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(26px, env(safe-area-inset-bottom));
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 0 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        animation: in 1.4s 1s ease both;
      }
      .foot p {
        margin: 0;
      }
      .invite {
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink);
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--line);
        cursor: pointer;
      }
      .invite:hover {
        text-decoration-color: var(--ink);
      }
      .capture {
        display: none;
      }
      .foot.is-open .invite {
        display: none;
      }
      .foot.is-open .capture {
        display: block;
      }
      .capture__row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: min(340px, 86vw);
        padding: 4px 4px 4px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fbf9f2;
      }
      .capture__row:focus-within {
        border-color: var(--green);
      }
      .capture input {
        flex: 1;
        min-width: 0;
        height: 32px;
        border: 0;
        background: transparent;
        font: 14px var(--sans);
        color: var(--ink);
        outline: none;
      }
      .capture input::placeholder {
        color: var(--muted);
      }
      .capture button {
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font: 500 13px var(--sans);
        cursor: pointer;
      }
      .capture__msg {
        margin: 8px 0 0;
        min-height: 1.5em;
      }
      .capture__msg:empty {
        display: none;
      }
      .capture__msg[data-state='error'] {
        color: #9a3b1e;
      }
      .capture__done {
        display: none;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--green);
      }
      .capture__plane {
        width: 16px;
        height: 16px;
      }
      .capture[data-done='true'] .capture__row,
      .capture[data-done='true'] .capture__msg {
        display: none;
      }
      .capture[data-done='true'] .capture__done {
        display: flex;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark,
        .for,
        .foot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- id="join" and [data-account-none] are a contract with the Rails app
         (Fuime::Signups sends a sign-in with no account to /?account=none#join). -->
    <main id="join">
      <div class="stack">
        <h1><img class="mark" src="/img/v2/logo.svg" width="49" height="41" alt="Fuime" /></h1>
        <p class="for">business accounts for teens.</p>
        <p class="sr">Fuime is a business account for teens, opened jointly with a parent or guardian. Coming in 2027.</p>
      </div>
    </main>

    <div class="foot" data-foot>
      <p data-account-none hidden>There's no Fuime account for that email. Sign-ups are closed for now.</p>
      <p>a joint account with a parent or guardian &middot; 2027</p>
      <button class="invite" type="button" data-invite>request an invite</button>
      <form class="capture" data-source="stealth-waitlist" novalidate>
        <div class="capture__row">
          <label class="sr" for="invite-email">Email address</label>
          <input id="invite-email" type="email" name="email" autocomplete="email" placeholder="email" required />
          <button type="submit">Send</button>
        </div>
        <p class="capture__msg" role="status" aria-live="polite"></p>
        <p class="capture__done">
          <svg class="capture__plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2.5 2.8 10.3a.4.4 0 0 0 .05.75l7.7 2.3 2.3 7.7a.4.4 0 0 0 .75.05Z"/><path d="M21.5 2.5 10.55 13.45"/></svg>
          noted. we'll write when it's ready.
        </p>
      </form>
    </div>

    <script>
      ;(function () {
        var foot = document.querySelector('[data-foot]')

        // The app's redirect for a sign-in with no account.
        if (/(?:^|[?&])account=none(?:&|$)/.test(location.search)) {
          document.querySelector('[data-account-none]').hidden = false
        }

        /* ── invite ─────────────────────────────────────────────────── */
        var invite = document.querySelector('[data-invite]')
        var form = document.querySelector('form.capture')
        var input = form.querySelector('input')
        var btn = form.querySelector('button[type="submit"]')
        var msg = form.querySelector('.capture__msg')
        var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/
        var busy = false

        invite.addEventListener('click', function () {
          foot.classList.add('is-open')
          input.focus()
        })

        form.addEventListener('submit', function (ev) {
          ev.preventDefault()
          if (busy) return
          var email = (input.value || '').trim()
          if (!EMAIL_RE.test(email) || email.length > 254) {
            msg.textContent = "that address doesn't look right."
            msg.setAttribute('data-state', 'error')
            input.focus()
            return
          }
          busy = true
          btn.disabled = true
          msg.textContent = ''
          fetch('/api/waitlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, source: form.getAttribute('data-source') }),
          })
            .then(function (res) {
              if (!res.ok) throw new Error('http ' + res.status)
              form.setAttribute('data-done', 'true')
            })
            .catch(function () {
              msg.textContent = "that didn't send. email support@fuime.com."
              msg.setAttribute('data-state', 'error')
            })
            .finally(function () {
              busy = false
              btn.disabled = false
            })
        })
      })()
    </script>
  </body>
</html>
