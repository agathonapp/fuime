<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=block" />
<style>
  html, body { margin: 0; background: #f7f3e8; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
// "Coins into the arch": fuime.com's og:video. One continuous shot.
// A payment drops through the keystone of a pixel arch as coins and piles up
// inside. The instruction types. A quarter of the coins hop back out of the
// slot and land in a second pile: taxes.
//
// The physics runs once, at a fixed timestep, when the page loads; draw(t)
// only reads the recorded frame, so every render is identical.
const W = 1200, H = 630, FPS = 30, DURATION = 10
const C = { ground: '#f7f3e8', ink: '#171a18', muted: '#8f8a7e', green: '#2e7d5b', line: '#e2dac8' }
const FONT = '"Satoshi", sans-serif'
const ctx = document.getElementById('c').getContext('2d')

// ── geometry ────────────────────────────────────────────────────────────
const PX = 10                      // one arch "pixel"
const CX = 470, FLOOR = 532        // arch centre x, ground line
const ROUT = 170, RIN = 140        // arch ring, outer and inner radius
const CY = FLOOR - 150             // centre of the semicircle
const SLOT = 32                    // half-width of the keystone slot
const R = 17                       // coin radius
const N = 20, POP = 5              // 20 coins = $3,150.00; 5 = $787.50
const EACH = 157.5
const TAX_X = CX + ROUT + 190      // taxes pile centre

// ── timeline ────────────────────────────────────────────────────────────
const T_TYPE = 0.5, T_TYPED = 1.75 // instruction types
const T_DROP = 2.0, DROP_GAP = 0.085
const T_POP = 5.35, POP_GAP = 0.3
const T_DONE = 7.55

// ── deterministic noise ─────────────────────────────────────────────────
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3)
const easeInOut = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }

// ── sprites ─────────────────────────────────────────────────────────────
// A 12x12 coin, lit from the top left: outline, shadow, base, mid, highlight.
function coinSprite() {
  const s = 12, c = document.createElement('canvas')
  c.width = c.height = s
  const g = c.getContext('2d')
  const T = { line: '#7a5a16', shadow: '#b8862a', base: '#d6a63a', mid: '#e8c264', hi: '#f7e3a4' }
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const dx = x + 0.5 - s / 2, dy = y + 0.5 - s / 2, d = Math.hypot(dx, dy)
    if (d > 5.9) continue
    let col
    if (d > 4.9) col = T.line
    else if (Math.abs(d - 3.1) < 0.55) col = (dx + dy > 0) ? T.mid : T.shadow // engraved ring
    else {
      const light = -(dx + dy) / 6           // top-left is lit
      col = light > 0.55 ? T.hi : light > 0.05 ? T.mid : light > -0.5 ? T.base : T.shadow
    }
    g.fillStyle = col
    g.fillRect(x, y, 1, 1)
  }
  return c
}
const COIN = coinSprite()

// The arch as a grid of PX blocks: a semicircular ring on two pillars, with a
// keystone slot. Three tones, lit from the top left.
const ARCH = (() => {
  const cells = []
  const x0 = CX - ROUT, x1 = CX + ROUT
  for (let y = CY - ROUT; y < FLOOR; y += PX) for (let x = x0; x < x1; x += PX) {
    const px = x + PX / 2, py = y + PX / 2
    const dx = px - CX, dy = py - CY, d = Math.hypot(dx, dy)
    let solid
    if (py < CY) solid = d >= RIN && d <= ROUT && Math.abs(dx) > SLOT + 2
    else solid = Math.abs(dx) >= RIN && Math.abs(dx) <= ROUT
    if (!solid) continue
    // tone: outer top-left faces catch light, inner bottom-right faces fall away
    const outer = d > ROUT - PX * 1.05 || (py >= CY && Math.abs(dx) > ROUT - PX * 1.05)
    const inner = d < RIN + PX * 1.05 || (py >= CY && Math.abs(dx) < RIN + PX * 1.05)
    const lit = dx < 0
    let col = '#2e7d5b'
    if (outer && lit) col = '#3f9a72'
    else if (inner && !lit) col = '#215c43'
    else if (outer && !lit) col = '#28704f'
    cells.push([x, y, col])
  }
  return cells
})()

// ── the physics, run once ───────────────────────────────────────────────
const FRAMES = (() => {
  const r = rng(7)
  const coins = []
  for (let i = 0; i < N; i++) coins.push({
    i, x: CX + (r() - 0.5) * 10, y: -40 - i * 4, px: 0, py: 0,
    born: T_DROP + i * DROP_GAP, alive: false, kin: null, landed: false,
  })
  for (const c of coins) { c.px = c.x; c.py = c.y - 4 }

  // taxes pile: three on the ground, two on top
  const taxSpots = [
    [TAX_X - 34, FLOOR - R], [TAX_X, FLOOR - R], [TAX_X + 34, FLOOR - R],
    [TAX_X - 17, FLOOR - R - 30], [TAX_X + 17, FLOOR - R - 30],
  ]
  const STEP = 1 / 240, SUB = 240 / FPS
  const G = 2600
  const out = []
  let popped = 0, t = 0
  const totalFrames = DURATION * FPS

  function solveBounds(c) {
    const dx = c.x - CX, dy = c.y - CY, d = Math.hypot(dx, dy)
    if (c.y < CY) {
      if (Math.abs(dx) < SLOT && d > RIN - R - 2 && d < ROUT + R) {
        // inside the keystone slot: walls on either side
        c.x = clamp(c.x, CX - SLOT + R, CX + SLOT - R)
      } else if (d < ROUT && c.y > CY - RIN) {
        if (d > RIN - R) { c.x = CX + dx / d * (RIN - R); c.y = CY + dy / d * (RIN - R) }
      }
    } else {
      c.x = clamp(c.x, CX - RIN + R, CX + RIN - R)
    }
    if (c.y > FLOOR - R) {
      c.y = FLOOR - R
      c.px = c.x + (c.px - c.x) * 0.6 + (c.x - c.px) * 0.0 // ground friction
      c.px = c.x - (c.x - c.px) * 0.6
    }
  }

  for (let f = 0; f < totalFrames; f++) {
    for (let s = 0; s < SUB; s++) {
      t += STEP
      // start popping: take whichever coin sits highest in the pile
      if (popped < POP && t >= T_POP + popped * POP_GAP) {
        const pile = coins.filter(c => c.alive && !c.kin)
        pile.sort((a, b) => a.y - b.y)
        const c = pile[0]
        c.kin = { t0: t, x0: c.x, y0: c.y, spot: taxSpots[popped] }
        popped++
      }
      for (const c of coins) {
        if (!c.alive) { if (t >= c.born) c.alive = true; else continue }
        if (c.kin) continue
        const vx = (c.x - c.px) * 0.998, vy = (c.y - c.py) * 0.998
        c.px = c.x; c.py = c.y
        c.x += vx; c.y += vy + G * STEP * STEP
      }
      // collisions between free coins, then the walls
      const free = coins.filter(c => c.alive && !c.kin)
      for (let it = 0; it < 4; it++) {
        for (let a = 0; a < free.length; a++) for (let b = a + 1; b < free.length; b++) {
          const A = free[a], B = free[b]
          const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 0.001
          if (d < 2 * R) {
            const k = (2 * R - d) / 2 / d
            A.x -= dx * k; A.y -= dy * k; B.x += dx * k; B.y += dy * k
          }
        }
        for (const c of free) solveBounds(c)
      }
    }
    // record: kinematic hops are computed from their own clock
    const ft = (f + 1) / FPS
    const rec = []
    for (const c of coins) {
      if (!c.alive) continue
      if (c.kin) {
        const k = c.kin, u = ft - k.t0
        const up = 0.26, arc = 0.62
        let x, y
        if (u < up) {          // lift to the slot and out through it
          const p = easeInOut(u / up)
          x = k.x0 + (CX - k.x0) * p
          y = k.y0 + (CY - ROUT - 46 - k.y0) * p
        } else if (u < up + arc) {
          const p = (u - up) / arc
          const sx = CX, sy = CY - ROUT - 46, [tx, ty] = k.spot
          x = sx + (tx - sx) * p
          y = sy + (ty - sy) * p - Math.sin(Math.PI * p) * 70
        } else {               // land, with one small settle
          const p = clamp((u - up - arc) / 0.12)
          const [tx, ty] = k.spot
          x = tx; y = ty - Math.sin(Math.PI * p) * 5
          k.landed = true
        }
        rec.push([x, y, 1, k.landed])
      } else {
        rec.push([c.x, c.y, 0, false])
      }
    }
    out.push({ coins: rec, popped, inside: coins.filter(c => c.alive && !c.kin && c.y > CY - RIN).length })
  }
  return out
})()

// ── drawing ─────────────────────────────────────────────────────────────
function typed(text, p) { return text.slice(0, Math.round(clamp(p) * text.length)) }
const cursorOn = t => Math.floor(t / 0.5) % 2 === 0
const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })

function draw(t) {
  t = ((t % DURATION) + DURATION) % DURATION
  const f = Math.min(FRAMES.length - 1, Math.floor(t * FPS))
  const fr = FRAMES[f]

  ctx.fillStyle = C.ground
  ctx.fillRect(0, 0, W, H)
  ctx.imageSmoothingEnabled = false

  // ground
  ctx.fillStyle = C.line
  ctx.fillRect(80, FLOOR, W - 160, 2)

  // coins behind the arch face, then the arch, so the slot reads as a slot
  for (const [x, y] of fr.coins) ctx.drawImage(COIN, Math.round(x - R), Math.round(y - R), R * 2, R * 2)
  for (const [x, y, col] of ARCH) { ctx.fillStyle = col; ctx.fillRect(x, y, PX, PX) }
  // a hopping coin passes in front of the arch once it is out of the slot
  for (const [x, y, kin] of fr.coins) if (kin && y < CY - ROUT) ctx.drawImage(COIN, Math.round(x - R), Math.round(y - R), R * 2, R * 2)

  // the instruction, top left, small
  ctx.textBaseline = 'alphabetic'
  ctx.font = `500 24px ${FONT}`
  ctx.fillStyle = C.ink
  const cmd = 'move 25% of every payment to taxes'
  const s = t < T_TYPE ? '' : typed(cmd, (t - T_TYPE) / (T_TYPED - T_TYPE))
  ctx.fillText(s, 80, 92)
  if ((t < T_TYPED && t > 0.15) || (t < T_DONE && cursorOn(t))) {
    ctx.fillRect(80 + ctx.measureText(s).width + 3, 72, 2.5, 26)
  }
  if (t >= T_DONE) {
    ctx.fillStyle = C.green
    ctx.fillText(typed('done. $787.50 moved.', (t - T_DONE) / 0.45), 80, 126)
  }

  // the payment, labelled where it enters
  if (t >= T_DROP - 0.2 && t < 4.6) {
    ctx.globalAlpha = clamp((t - T_DROP + 0.2) / 0.2) * clamp((4.6 - t) / 0.3)
    ctx.font = `500 17px ${FONT}`
    ctx.fillStyle = C.muted
    ctx.fillText('m. chen paid $3,150.00', CX + SLOT + 18, 196)
    ctx.globalAlpha = 1
  }

  // balances, under each pile
  const landedTax = fr.coins.filter(c => c[2] && c[3]).length
  const operating = Math.max(0, (fr.inside + fr.popped - landedTax) - (fr.popped - landedTax)) * EACH
  ctx.font = `500 17px ${FONT}`
  ctx.fillStyle = C.muted
  ctx.fillText('operating', CX - 52, FLOOR + 40)
  ctx.fillStyle = C.ink
  ctx.fillText(money(operating), CX - 52, FLOOR + 64)
  if (fr.popped > 0) {
    ctx.globalAlpha = clamp((t - T_POP) / 0.3)
    ctx.fillStyle = C.muted
    ctx.fillText('taxes', TAX_X - 34, FLOOR + 40)
    ctx.fillStyle = C.ink
    ctx.fillText(money(landedTax * EACH), TAX_X - 34, FLOOR + 64)
    ctx.globalAlpha = 1
  }

  // the name, quietly, bottom right
  ctx.font = `500 17px ${FONT}`
  ctx.fillStyle = C.muted
  const tag = 'fuime · 2027'
  ctx.fillText(tag, W - 80 - ctx.measureText(tag).width, 92)
}

window.ready = (async () => {
  await document.fonts.load(`500 24px "Satoshi"`)
  await document.fonts.ready
  draw(0)
  return true
})()
window.draw = draw
window.DURATION = DURATION
</script>
</body>
</html>
