databases:
  - name: fuime-postgres
    plan: basic-256mb
    databaseName: fuime_production
    user: fuime
    ipAllowList: []

services:
  - type: redis
    name: fuime-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: fuime-web
    runtime: docker
    dockerfilePath: ./production.Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuime-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fuime-redis
          type: redis
          property: connectionString
      # config/cable.yml and the production cache_store read REDIS_CACHE_URL.
      # Without it they silently fall back to redis://localhost:6379/1, which
      # makes every ActionCable broadcast job fail with Redis::CannotConnectError.
      - key: REDIS_CACHE_URL
        fromService:
          name: fuime-redis
          type: redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: LANG
        value: en_US.UTF-8
      # Uploaded receipts MUST go to S3. Render's filesystem is ephemeral, so
      # the previous :local default destroyed every receipt on each deploy —
      # the records families need for tax filing. The boot-time safety check
      # (config/initializers/fuime_safety_check.rb) refuses to start on :local.
      - key: ACTIVE_STORAGE_SERVICE
        value: amazon
      - key: S3__BUCKET
        sync: false
      - key: S3__REGION
        sync: false
      - key: S3__ACCESS_KEY_ID
        sync: false
      - key: S3__SECRET_ACCESS_KEY
        sync: false
      # Optional. Set to point Active Storage at a non-AWS S3-compatible store
      # (Cloudflare R2, Backblaze B2, MinIO). Leave unset for AWS S3.
      # R2 example: https://<account-id>.r2.cloudflarestorage.com  (region: auto)
      # A Render persistent disk is NOT an option here: a disk is reachable by
      # exactly one service instance, and both fuime-web and fuime-worker read
      # uploaded files. See the comment in config/storage.yml.
      - key: S3__ENDPOINT
        sync: false
      # Stripe mode. Fuime defaults to test mode everywhere, including
      # production, because the money-transmission structure is not yet
      # legally settled (docs/fuime/PRODUCTION_READINESS.md §1.5).
      # Set to "live" ONLY alongside STRIPE__LIVE__* credentials.
      - key: STRIPE_MODE
        value: test
      # Signing secret for the Fuime payment webhook endpoint. Without it every
      # Stripe webhook is rejected and payments never reach a ledger.
      - key: FUIME_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MASTER_KEY
        sync: false
      # Active Record Encryption keys
      - key: ACTIVE_RECORD__ENCRYPTION__DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD__ENCRYPTION__KEY_DERIVATION_SALT
        sync: false
      - key: ACTIVE_RECORD__ENCRYPTION__PRIMARY_KEY
        sync: false
      # Lockbox encryption
      - key: LOCKBOX
        sync: false
      # Column banking integration
      - key: COLUMN__SANDBOX__API_KEY
        sync: false
      - key: COLUMN__SANDBOX__DEFAULT_ACCOUNT_NUMBER
        sync: false
      - key: COLUMN__SANDBOX__FS_MAIN_ACCOUNT_ID
        sync: false
      - key: COLUMN__SANDBOX__FS_OPERATING_ACCOUNT_ID
        sync: false
      - key: COLUMN__SANDBOX__WEBHOOK_SECRET
        sync: false
      # Stripe integration
      - key: STRIPE__TEST__PUBLISHABLE_KEY
        sync: false
      - key: STRIPE__TEST__SECRET_KEY
        sync: false
      - key: STRIPE__TEST__PHYSICAL_BUNDLE_IDS__US_VISA_CREDIT_BLACK
        sync: false
      - key: STRIPE__TEST__PHYSICAL_BUNDLE_IDS__US_VISA_CREDIT_WHITE
        sync: false
      # OpenAI
      - key: OPENAI_API_KEY
        sync: false
      # Twilio
      - key: TWILIO__SMS_VERIFY__ACCOUNT_SID
        sync: false
      - key: TWILIO__SMS_VERIFY__AUTH_TOKEN
        sync: false
      # Doppler (secrets management)
      - key: DOPPLER_TOKEN
        sync: false
      # URLs
      - key: LIVE_URL_HOST
        sync: false
      - key: TEST_URL_HOST
        sync: false
      # HelpScout
      - key: HELPSCOUT__BEACON_ID
        sync: false
      # Hashid
      - key: HASHID_SALT
        sync: false
      # TaxBandits
      - key: TAXBANDITS__CLIENT_ID
        sync: false
      - key: TAXBANDITS__CLIENT_SECRET
        sync: false
      - key: TAXBANDITS__USER_TOKEN
        sync: false
      - key: TAXBANDITS__CUSTOMIZATION_ID
        sync: false
      - key: TAXBANDITS__DOMAIN_ID
        sync: false
      # Resend SMTP for email delivery
      - key: SMTP__USERNAME
        value: resend
      - key: SMTP__PASSWORD
        sync: false
      - key: SMTP__ADDRESS
        value: smtp.resend.com
      - key: SMTP__DOMAIN
        value: fuime.com
      - key: SMTP__PORT
        value: "587"
      # AWS
      - key: AWS_REGION
        value: us-east-1
      # AWS KMS
      - key: AWS_KMS__TIN_KEY_ID
        sync: false
      - key: AWS_KMS__REGION
        sync: false
      - key: AWS_KMS__ACCESS_KEY_ID
        sync: false
      - key: AWS_KMS__SECRET_ACCESS_KEY
        sync: false
      # Error tracking. Appsignal is already wired into the app; the key has
      # never been set, which is why a total homepage outage was once invisible
      # until someone happened to load the site. Render's log search is not
      # error tracking: with real users you learn about failures from an email.
      #
      # REQUIRED BEFORE REAL USERS. Set this in the Render dashboard on BOTH
      # fuime-web and fuime-worker, then add alerts on 500-rate and on Sidekiq
      # job failures — a key with no alert attached is still nobody watching.
      - key: APPSIGNAL_PUSH_API_KEY
        sync: false
      - key: APPSIGNAL_APP_ENV
        value: production

  # The marketing site on fuime.com. Separate from fuime-web because it shares
  # nothing with it: no database, no Redis, no Rails. A node service rather
  # than a Render static site because /api/waitlist needs a process, and
  # serving it from the same origin as the pages avoids CORS entirely.
  - type: web
    name: fuime-site
    runtime: node
    plan: starter
    rootDir: site
    buildCommand: "" # No dependencies and no build step. The files ship as-is.
    startCommand: node server.js
    healthCheckPath: /robots.txt
    envVars:
      # Where /login sends people. The Rails app.
      - key: APP_ORIGIN
        value: https://app.fuime.com
      # Waitlist sinks. At least one group must be set or /api/waitlist
      # answers 503 rather than showing a green check over a dropped address.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WAITLIST_NOTIFY_TO
        sync: false
      - key: WAITLIST_NOTIFY_FROM
        value: fuime <rushil@fuime.com>

  - type: worker
    name: fuime-worker
    runtime: docker
    dockerfilePath: ./production.Dockerfile
    dockerContext: .
    plan: standard
    dockerCommand: bundle exec sidekiq
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuime-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fuime-redis
          type: redis
          property: connectionString
      # config/cable.yml and the production cache_store read REDIS_CACHE_URL.
      # Without it they silently fall back to redis://localhost:6379/1, which
      # makes every ActionCable broadcast job fail with Redis::CannotConnectError.
      - key: REDIS_CACHE_URL
        fromService:
          name: fuime-redis
          type: redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: "10"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: LANG
        value: en_US.UTF-8
      # See the web service for why these are required.
      - key: ACTIVE_STORAGE_SERVICE
        value: amazon
      - key: S3__BUCKET
        sync: false
      - key: S3__REGION
        sync: false
      - key: S3__ACCESS_KEY_ID
        sync: false
      - key: S3__SECRET_ACCESS_KEY
        sync: false
      # Optional. Set to point Active Storage at a non-AWS S3-compatible store
      # (Cloudflare R2, Backblaze B2, MinIO). Leave unset for AWS S3.
      # R2 example: https://<account-id>.r2.cloudflarestorage.com  (region: auto)
      # A Render persistent disk is NOT an option here: a disk is reachable by
      # exactly one service instance, and both fuime-web and fuime-worker read
      # uploaded files. See the comment in config/storage.yml.
      - key: S3__ENDPOINT
        sync: false
      - key: STRIPE_MODE
        value: test
      - key: FUIME_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY_BASE
        fromService:
          name: fuime-web
          type: web
          envVarKey: SECRET_KEY_BASE
      - key: RAILS_MASTER_KEY
        sync: false
      # Active Record Encryption keys
      - key: ACTIVE_RECORD__ENCRYPTION__DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD__ENCRYPTION__KEY_DERIVATION_SALT
        sync: false
      - key: ACTIVE_RECORD__ENCRYPTION__PRIMARY_KEY
        sync: false
      # Lockbox encryption
      - key: LOCKBOX
        sync: false
      # Column banking integration
      - key: COLUMN__SANDBOX__API_KEY
        sync: false
      - key: COLUMN__SANDBOX__DEFAULT_ACCOUNT_NUMBER
        sync: false
      - key: COLUMN__SANDBOX__FS_MAIN_ACCOUNT_ID
        sync: false
      - key: COLUMN__SANDBOX__FS_OPERATING_ACCOUNT_ID
        sync: false
      - key: COLUMN__SANDBOX__WEBHOOK_SECRET
        sync: false
      # Stripe integration
      - key: STRIPE__TEST__PUBLISHABLE_KEY
        sync: false
      - key: STRIPE__TEST__SECRET_KEY
        sync: false
      - key: STRIPE__TEST__PHYSICAL_BUNDLE_IDS__US_VISA_CREDIT_BLACK
        sync: false
      - key: STRIPE__TEST__PHYSICAL_BUNDLE_IDS__US_VISA_CREDIT_WHITE
        sync: false
      # OpenAI
      - key: OPENAI_API_KEY
        sync: false
      # Twilio
      - key: TWILIO__SMS_VERIFY__ACCOUNT_SID
        sync: false
      - key: TWILIO__SMS_VERIFY__AUTH_TOKEN
        sync: false
      # Doppler (secrets management)
      - key: DOPPLER_TOKEN
        sync: false
      # URLs
      - key: LIVE_URL_HOST
        sync: false
      - key: TEST_URL_HOST
        sync: false
      # HelpScout
      - key: HELPSCOUT__BEACON_ID
        sync: false
      # Hashid
      - key: HASHID_SALT
        sync: false
      # TaxBandits
      - key: TAXBANDITS__CLIENT_ID
        sync: false
      - key: TAXBANDITS__CLIENT_SECRET
        sync: false
      - key: TAXBANDITS__USER_TOKEN
        sync: false
      - key: TAXBANDITS__CUSTOMIZATION_ID
        sync: false
      - key: TAXBANDITS__DOMAIN_ID
        sync: false
      # Resend SMTP for email delivery
      - key: SMTP__USERNAME
        value: resend
      - key: SMTP__PASSWORD
        sync: false
      - key: SMTP__ADDRESS
        value: smtp.resend.com
      - key: SMTP__DOMAIN
        value: fuime.com
      - key: SMTP__PORT
        value: "587"
      # AWS
      - key: AWS_REGION
        value: us-east-1
      # AWS KMS
      - key: AWS_KMS__TIN_KEY_ID
        sync: false
      - key: AWS_KMS__REGION
        sync: false
      - key: AWS_KMS__ACCESS_KEY_ID
        sync: false
      - key: AWS_KMS__SECRET_ACCESS_KEY
        sync: false
      # Error tracking — see the note on fuime-web. Sidekiq failures surface
      # here, not on the web service, so this key is required on BOTH.
      - key: APPSIGNAL_PUSH_API_KEY
        sync: false
      - key: APPSIGNAL_APP_ENV
        value: production
